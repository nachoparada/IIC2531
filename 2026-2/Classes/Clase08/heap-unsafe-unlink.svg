<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Corrupción de metadatos durante unsafe unlink</title>
  <desc id="desc">Un overflow modifica prev y next del bloque B. El allocator confía en esos punteros y realiza escrituras usando valores controlados por el atacante.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="riskArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="500" fill="#fff"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Unsafe unlink: el allocator confía en metadatos corruptos</text>

  <!-- Step 1 -->
  <text x="115" y="91" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2563eb">1 · OVERFLOW</text>
  <rect x="110" y="115" width="270" height="190" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <text x="245" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Bloque controlado</text>
  <text x="245" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569">datos del atacante</text>
  <path d="M245 235 H448" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#riskArrow)"/>
  <text x="315" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#dc2626">escritura fuera del límite</text>

  <rect x="450" y="115" width="270" height="190" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="4"/>
  <text x="585" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Bloque libre B</text>
  <path d="M450 177 H720 M450 240 H720" stroke="#dc2626" stroke-width="3"/>
  <text x="585" y="214" text-anchor="middle" font-family="monospace" font-size="21" fill="#dc2626">prev = x</text>
  <text x="585" y="278" text-anchor="middle" font-family="monospace" font-size="21" fill="#dc2626">next = y</text>
  <text x="585" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#dc2626">x e y fueron elegidos por el atacante</text>

  <!-- Step 2 -->
  <path d="M745 210 H800" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="775" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">unlink(B)</text>
  <text x="820" y="91" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#dc2626">2 · ESCRITURAS</text>
  <rect x="805" y="115" width="285" height="190" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
  <text x="947" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">El allocator ejecuta</text>
  <text x="947" y="207" text-anchor="middle" font-family="monospace" font-size="19" fill="#9a3412">y-&gt;prev = x</text>
  <text x="947" y="250" text-anchor="middle" font-family="monospace" font-size="19" fill="#9a3412">x-&gt;next = y</text>
  <text x="947" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">sin validar los punteros</text>

  <rect x="205" y="380" width="790" height="78" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="600" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#991b1b">Consecuencia histórica: una primitiva de escritura controlada</text>
  <text x="600" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#7f1d1d">El overflow de datos se convierte en modificación de otra ubicación de memoria.</text>
</svg>
